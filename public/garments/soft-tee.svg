      <stop offset="50%" stop-color="#e8f5ef" stop-opacity="0.16"/>
      <stop offset="82%" stop-color="#2c4038" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1d2b25" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="drapeFold" x1="0" y1="0" x2="1" y2="0">
