<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560">
  <defs>
    <linearGradient id="teeBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b8f80"/>
      <stop offset="45%" stop-color="#587b6d"/>
      <stop offset="100%" stop-color="#425f53"/>
    </linearGradient>
    <linearGradient id="teeCylinder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d2b25" stop-opacity="0.48"/>
